server {
    listen 80;
    server_name nmacademy.kz;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nmacademy.kz;

    ssl_certificate     /etc/letsencrypt/live/nmuacademy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nmuacademy/privkey.pem;

    location /admin/ {
        return 301 https://admin.nmacademy.kz$request_uri;
    }

    location /graphql {
        proxy_pass http://backend:5000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
