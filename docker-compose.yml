version: "3.8"

services:
    client:
        build:
            context: ./nmu_client
        container_name: nmu_client
        expose:
            - "3000"
        env_file:
            - .env
        networks:
            - app-network

    admin:
        build:
            context: ./nmu_admin
        container_name: nmu_admin
        expose:
            - "3000"
        env_file:
            - .env
        networks:
            - app-network

    backend:
        build:
            context: ./nmu_app
        container_name: nmu_backend
        expose:
            - "5000"
        env_file:
            - .env
        depends_on:
            - db
        networks:
            - app-network

    db:
        image: mongo:latest
        container_name: nmu_mongo
        ports:
            - "27017:27017"
        volumes:
            - db-data:/data/db
        networks:
            - app-network

    nginx:
        build:
            context: ./nginx
        container_name: nmu_nginx
        ports:
            - "443:443"
            - "80:80"
        volumes:
            - ./nginx/ssl:/etc/nginx/ssl
        depends_on:
            - client
            - admin
            - backend
        networks:
            - app-network

volumes:
    db-data:

networks:
    app-network:
        driver: bridge
