version: '3.9'

# ----------  GLOBAL CONSTANTS  ----------
# Mongo credentials (root)
x-mongo-user: &mongo_user nmu_root
x-mongo-pass: &mongo_pass ***REMOVED***
# Mongo connection string (used by backend / front-apps)
x-mongo-uri: &mongo_uri mongodb://nmu_root:***REMOVED***@db:27017/nmu_v2?authSource=admin

services:
  # ----------  MONGODB  ----------
  db:
    image: mongo:8
    container_name: nmu_mongo
    ports: ['27017:27017'] # expose for local debugging
    environment:
      MONGO_INITDB_ROOT_USERNAME: *mongo_user
      MONGO_INITDB_ROOT_PASSWORD: ***REMOVED***
      MONGO_INITDB_DATABASE: nmu_v2
    volumes:
      - db-data:/data/db
    networks: [app-network]

  client:
    build: ./nmu_client
    container_name: nmu_client
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      SERVER_PORT: '5000'
      MONGODB_URI: *mongo_uri
      MONGODB_DB: nmu_v2
      JWT_SECRET: ***REMOVED***
      NODE_ENV: production
      NEXT_PUBLIC_GRAPHQL_API: http://nginx/graphql
      PORT: '3000'
    networks:
      - app-network

  admin:
    build: ./nmu_admin
    container_name: nmu_admin
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      SERVER_PORT: '5000'
      MONGODB_URI: *mongo_uri
      MONGODB_DB: nmu_v2
      JWT_SECRET: ***REMOVED***
      NODE_ENV: production
      NEXT_PUBLIC_GRAPHQL_API: http://nginx/graphql
      PORT: '3000'
    networks:
      - app-network

  backend:
    build: ./nmu_app
    container_name: nmu_backend
    expose:
      - '5000'
    env_file:
      - .env
    environment:
      SERVER_PORT: '5000'
      MONGODB_URI: *mongo_uri
      MONGODB_DB: nmu_v2
      JWT_SECRET: ***REMOVED***
      NODE_ENV: production
      CORS_ORIGIN: http://client:3000,http://admin:3000
      PORT: '5000'
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    build: ./data/nginx
    container_name: nmu_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    depends_on:
      - client
      - admin
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: nmu_certbot
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
          --email you@example.com --agree-tos --no-eff-email
          -d admin-nmuacademy.kz"

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
