query GetMonitoring($args: UserMonitoringArgs!) {
	getMonitoring(args: $args) {
		total
		items {
			_id
			lastActiveDate
			lastActiveDays
			lastActiveLesson
			phoneNumber
			userName
			userRole
			hasMentorSupport
			isFrozen
			freezes {
				startDate
				endDate
			}
			availableCourses {
				accessEndDate
				accessStartDate
				courseId
				courseName
				trialPeriod
			}
			coursesProgress {
				courseId
				courseName
				completedLessons
				totalLessons
				label
			}
		}
	}
}
