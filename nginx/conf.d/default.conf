server {
    listen 80 default_server;
    server_name _;  # Обслуживает все домены и IP

    # Админ-панель — http://0.0.0.0/admin
    location /admin/ {
        proxy_pass http://nmu_admin:4000/;
        rewrite ^/admin/?(.*)$ /$1 break;
    }

    # API и GraphQL — http://0.0.0.0/api, /graphql
    location /api/ {
        proxy_pass http://nmu_app:5000;
    }
    location /graphql {
        proxy_pass http://nmu_app:5000;
    }

    # Фронт — всё остальное по адресу http://0.0.0.0/
    location /_next/ {
        proxy_pass http://nmu_client:3000;
    }
    location / {
        proxy_pass http://nmu_client:3000;
    }
}
